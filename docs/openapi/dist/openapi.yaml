openapi: 3.1.0
info:
  title: 'mucajey Card API'
  version: 2.0.7
servers:
  -
    url: 'http://localhost:3000'
    description: 'Local development server'
  -
    url: 'https://api.mucajey.twicemind.com'
    description: 'Production server'
paths:
  /stats:
    get:
      summary: 'Collects aggregated statistics about cached editions and cards.'
      description: 'Collects aggregated statistics about cached editions and cards.'
      tags: [Stats]
      parameters: []
      responses: {'200': {description: 'Successful response'}}
  /api/register:
    post:
      summary: 'Issue or return an API key tied to the provided application details.'
      description: 'Issue or return an API key tied to the provided application details.'
      tags: [Register]
      parameters: []
      responses: {'200': {description: 'Successful response'}, '201': {description: Created}, '400': {description: 'Bad Request'}, '500': {description: 'Internal Server Error'}}
  /login:
    post:
      summary: 'Authenticates a user with their username and password.'
      description: 'Authenticates a user with their username and password.'
      tags: [Login]
      parameters: []
      responses: {'200': {description: 'Successful response'}}
  /logout:
    post:
      summary: 'Invalidates the current authentication session.'
      description: 'Invalidates the current authentication session.'
      tags: [Login]
      parameters: []
      responses: {'200': {description: 'Successful response'}}
  /health:
    get:
      summary: 'Health check endpoint to verify if the API is running.'
      description: 'Health check endpoint to verify if the API is running.'
      tags: [Health]
      parameters: []
      responses: {'200': {description: 'Successful response'}}
  /edition/:
    get:
      summary: 'Explains how to create a new card edition data inside the edition store.'
      description: 'Explains how to create a new card edition data inside the edition store.'
      tags: [Edition]
      parameters: []
      responses: {'200': {description: 'Successful response'}}
  /edition/all:
    get:
      summary: 'List every edition edition_id along with metadata that is currently cached in memory.'
      description: 'List every edition edition_id along with metadata that is currently cached in memory.'
      tags: [Edition]
      parameters: []
      responses: {'200': {description: 'Successful response'}}
  /edition:
    post:
      summary: 'Creates a new edition JSON edition_id with the required metadata and an empty card list.'
      description: 'Creates a new edition JSON edition_id with the required metadata and an empty card list.'
      tags: [Edition]
      parameters: []
      responses: {'200': {description: 'Successful response'}, '201': {description: Created}, '400': {description: 'Bad Request'}, '409': {description: Conflict}}
  '/edition/{edition_id}':
    get:
      summary: 'Retrieve a specific edition edition_id by its identifier.'
      description: 'Retrieve a specific edition edition_id by its identifier.'
      tags: [Edition]
      parameters: [{name: edition_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}, '404': {description: 'Not Found'}}
    put:
      summary: 'Update a specific edition edition_id by its identifier.'
      description: 'Update a specific edition edition_id by its identifier.'
      tags: [Edition]
      parameters: [{name: edition_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}, '404': {description: 'Not Found'}}
    delete:
      summary: 'Delete a specific edition edition_id by its identifier.'
      description: 'Delete a specific edition edition_id by its identifier.'
      tags: [Edition]
      parameters: [{name: edition_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}, '404': {description: 'Not Found'}, '500': {description: 'Internal Server Error'}}
  '/edition/image/{edition_id}':
    get:
      summary: 'Delivers the edition image as binary (png/jpg/...).'
      description: 'Delivers the edition image as binary (png/jpg/...).'
      tags: [Edition-image]
      parameters: [{name: edition_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}, '404': {description: 'Not Found'}}
  /card/:
    get:
      summary: 'Learn how to interact with the card collection support endpoints. Includes authentication reminder.'
      description: 'Learn how to interact with the card collection support endpoints. Includes authentication reminder.'
      tags: [Card]
      parameters: []
      responses: {'200': {description: 'Successful response'}}
  /card/all:
    get:
      summary: 'Returns every card aggregated from the JSON files currently cached in memory. - openapi gen -'
      description: 'Returns every card aggregated from the JSON files currently cached in memory. - openapi gen -'
      tags: [Card]
      parameters: []
      responses: {'200': {description: 'Successful response'}}
  '/card/id/{edition}/{id}':
    get:
      summary: 'Retrieve the card that belongs to a specific edition and identifier.'
      description: 'Retrieve the card that belongs to a specific edition and identifier.'
      tags: [Card]
      parameters: [{name: edition, in: path, required: true, schema: {type: string}}, {name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}, '404': {description: 'Not Found'}}
  '/card/title/{title}':
    get:
      summary: 'List all cards whose title exactly matches the requested value.'
      description: 'List all cards whose title exactly matches the requested value.'
      tags: [Card]
      parameters: [{name: title, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}}
  '/card/artist/{artist}':
    get:
      summary: 'List all cards whose artist exactly matches the requested value.'
      description: 'List all cards whose artist exactly matches the requested value.'
      tags: [Card]
      parameters: [{name: artist, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}}
  '/card/year/{year}':
    get:
      summary: 'List all cards from the specified year.'
      description: 'List all cards from the specified year.'
      tags: [Card]
      parameters: [{name: year, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}}
  '/card/edition/{edition}':
    get:
      summary: 'List all cards from the specified edition.'
      description: 'List all cards from the specified edition.'
      tags: [Card]
      parameters: [{name: edition, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}}
  '/card/genre/{genre}':
    get:
      summary: 'List all cards from the specified genre.'
      description: 'List all cards from the specified genre.'
      tags: [Card]
      parameters: [{name: genre, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}}
  '/card/search/{query}':
    get:
      summary: 'Search for cards matching the query string.'
      description: 'Search for cards matching the query string.'
      tags: [Card]
      parameters: [{name: query, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}}
  /card:
    post:
      summary: 'Create a new card.'
      description: 'Create a new card.'
      tags: [Card]
      parameters: []
      responses: {'200': {description: 'Successful response'}, '201': {description: Created}, '400': {description: 'Bad Request'}}
  '/card/{edition}/{id}/apple/search':
    post:
      summary: 'Run an Apple Music search for the requested card and persist the ID+URI.'
      description: 'Run an Apple Music search for the requested card and persist the ID+URI.'
      tags: [Card]
      parameters: [{name: edition, in: path, required: true, schema: {type: string}}, {name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}, '400': {description: 'Bad Request'}, '404': {description: 'Not Found'}, '500': {description: 'Internal Server Error'}, '502': {description: 'Bad Gateway'}}
  '/card/{edition}/{id}':
    patch:
      summary: 'Update a card by edition and id.'
      description: 'Update a card by edition and id.'
      tags: [Card]
      parameters: [{name: edition, in: path, required: true, schema: {type: string}}, {name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}, '404': {description: 'Not Found'}}
    delete:
      summary: 'Delete a card by edition and id.'
      description: 'Delete a card by edition and id.'
      tags: [Card]
      parameters: [{name: edition, in: path, required: true, schema: {type: string}}, {name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}, '404': {description: 'Not Found'}}
  /auth/me:
    get:
      summary: 'Returns the current authenticated user.'
      description: 'Returns the current authenticated user.'
      tags: [Auth]
      parameters: []
      responses: {'200': {description: 'Successful response'}, '401': {description: Unauthorized}}
  /auth/users:
    get:
      summary: 'Lists every user allowed to access the admin area.'
      description: 'Lists every user allowed to access the admin area.'
      tags: [Auth]
      parameters: []
      responses: {'200': {description: 'Successful response'}}
    post:
      summary: 'Creates a new user account for the admin area.'
      description: 'Creates a new user account for the admin area.'
      tags: [Auth]
      parameters: []
      responses: {'200': {description: 'Successful response'}, '201': {description: Created}, '400': {description: 'Bad Request'}, '409': {description: Conflict}}
  /auth/users/password:
    post:
      summary: 'Updates the authenticated user''s password.'
      description: 'Updates the authenticated user''s password.'
      tags: [Auth]
      parameters: []
      responses: {'200': {description: 'Successful response'}, '400': {description: 'Bad Request'}, '401': {description: Unauthorized}, '404': {description: 'Not Found'}}
  '/auth/users/{username}/password':
    post:
      summary: 'Allows admins to reset another user''s password.'
      description: 'Allows admins to reset another user''s password.'
      tags: [Auth]
      parameters: [{name: username, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}, '400': {description: 'Bad Request'}, '404': {description: 'Not Found'}}
  '/auth/users/{username}':
    delete:
      summary: 'Removes a user from the admin list.'
      description: 'Removes a user from the admin list.'
      tags: [Auth]
      parameters: [{name: username, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'Successful response'}, '400': {description: 'Bad Request'}, '404': {description: 'Not Found'}}
components: {}
