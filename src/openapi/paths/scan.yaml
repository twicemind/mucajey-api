paths:
  /{edition}/{cardId}:
    get:
      summary: Get scanned card with auto-sync for Apple Music
      description: Get scanned card with auto-sync for Apple Music
      tags:
        - Scan
      parameters:
        - name: edition
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /{edition}/{cardId}/apple:
    get:
      summary: Get only Apple ID
      description: Get only Apple ID
      tags:
        - Scan
      parameters:
        - name: edition
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
