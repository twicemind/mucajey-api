        - Edition
      parameters:
        - name: edition
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '404':
          description: Not Found
    delete:
      summary: Delete a specific edition file by its identifier.
      description: Delete a specific edition file by its identifier.
      tags:
        - Edition
      parameters:
        - name: edition
          in: path
          required: true
          schema:
            type: string
      responses:
