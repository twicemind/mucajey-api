    get:
      summary: Retrieve a specific edition file by its identifier.
      description: Retrieve a specific edition file by its identifier.
      tags:
        - Edition
      parameters:
        - name: edition
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '404':
          description: Not Found
    put:
      summary: Update a specific edition file by its identifier.
