paths:
  /:
    get:
      summary: List all available files
      description: List all available files
      tags:
        - Files
      parameters: []
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal Server Error
  /all-data:
    get:
      summary: Merge all data from all JSON files
      description: Merge all data from all JSON files
      tags:
        - Files
      parameters: []
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal Server Error
  /{filename}:
    get:
      summary: Load specific file
      description: Load specific file
      tags:
        - Files
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
