services:
  # Haupt-Backend (Node.js) für iOS App
  mucajey-backend:
    build: .
    container_name: mucajey-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_KEY=${API_KEY:-mucajey-dev-key-2024}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
    volumes:
      - ./src/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Admin-Backend (FastAPI)
  admin-backend:
    build: ./admin
    container_name: mucajey-admin-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
    volumes:
      - ./src/data:/app/src/data
      - ./scripts:/app/scripts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Admin-Frontend (React + Vite) - nur für Development
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile.dev
    container_name: mucajey-admin-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./admin-frontend:/app
      - /app/node_modules
    restart: unless-stopped
    command: npm run dev -- --host

